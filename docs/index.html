<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Regime Consensus</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div id="app"><div class="loading">Loading signals...</div></div>
<footer></footer>

<script src="app.js"></script>
<script>
renderNav('index.html');

const ACTION = {
  Overweight: (s) => `Hold ${s.equity_offset} points more in stocks than your neutral mix.`,
  Underweight: (s) => `Hold ${Math.abs(s.equity_offset)} points less in stocks than your neutral mix.`,
  Neutral: () => 'Hold your neutral mix. The frameworks do not agree strongly enough to lean either way.',
};
const ROLE = {
  driver: ['Drivers', 'These four families vote on direction, from -1 to +1.'],
  alarm: ['Alarms', 'These can only subtract. A quiet alarm is the absence of bad news, not good news.'],
  sizing: ['Sizing', 'Valuation never moves the stance. It sets how large a move is allowed to be.'],
  info: ['Where to look', 'These do not move the stance. They show which asset classes and sectors are leading.'],
};

function verdict(d) {
  const s = d.stance, pct = (x) => ((x + 1) / 2) * 100;
  const act = (ACTION[s.label] || (() => 'Not enough data to take a stance this month.'))(s);
  const notes = [];
  if (s.raw_label && s.raw_label !== s.label) notes.push(['', `This month's reading is ${s.raw_label}. A change needs two months in a row before the stance moves.`]);
  s.breakers.forEach((b) => notes.push(['warn', b]));
  notes.push(['', { expensive: `Valuation reads expensive, so an Overweight is limited to +${s.step_up} points.`,
    cheap: `Valuation reads cheap, so an Underweight is limited to -${s.step_down} points.`,
    neutral: 'Valuation is in its normal range, so moves are full size.', unknown: 'No valuation reading this month.' }[s.valuation_tilt]]);
  notes.push(['', { cash: 'The Fed is hiking: keep half of the bond-and-cash sleeve in cash and T-bills.',
    bonds: 'The Fed is cutting: keep most of the bond-and-cash sleeve in bonds.',
    split: 'The Fed is on hold: keep your usual split between bonds and cash.' }[s.defensive]]);
  return `<div class="card verdict">
    <div>
      <div class="label">Consensus for ${esc(d.as_of_label)}</div>
      <div class="stance ${esc(s.label)}">${esc(s.label)}</div>
      <div class="action">${esc(act)}</div>
      <ul class="notes">${notes.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join('')}</ul>
    </div>
    <div>
      <div class="gauge">
        ${s.composite == null ? '' : `<div class="marker" style="left:${pct(s.composite)}%"><span>${signed(s.composite)}</span></div>`}
        <span class="tick" style="left:12.5%">Underweight</span><span class="tick" style="left:50%">Neutral</span><span class="tick" style="left:87.5%">Overweight</span>
      </div>
      <div class="stats">
        <div class="stat"><span class="label">Drivers</span><b>${signed(s.driver_score)}</b></div>
        <div class="stat"><span class="label">Alarms</span><b>${signed(s.alarm_penalty)}</b></div>
        <div class="stat"><span class="label">Agreement</span><b>${s.agreement == null ? 'n/a' : Math.round(s.agreement * 100) + '%'}</b></div>
      </div>
      <p class="hint" style="margin-top:10px">Score = drivers + alarms. It takes ${signed(s.threshold, 1)} or more to go Overweight and ${signed(-s.threshold, 1)} or less to go Underweight. <a href="methodology.html">How this works</a></p>
    </div>
  </div>`;
}

function allocation(d) {
  const a = d.allocation, max = Math.max(...Object.values(a.tally), 1);
  const names = Object.fromEntries(d.frameworks.map((f) => [f.id, f.name]));
  return `<h2>Model allocation</h2>
  <p class="hint">What the consensus implies for a ${ASSETS.map((k) => a.neutral[k]).join('/')} neutral mix of stocks, bonds, cash and alternatives. <a href="calculator.html">Use your own mix and dollar amounts</a></p>
  <div class="grid two">
    <div class="card">
      <div class="label">This month</div>${mixBar(a.model)}
      <div class="label" style="margin-top:14px">Neutral</div>${mixBar(a.neutral)}
    </div>
    <div class="card">
      <div class="label">What the playbooks favor</div>
      <div class="tally">${ASSETS.map((k) => `<span>${ASSET_NAME[k]}</span><div class="track"><i class="a-${k}" style="width:${(a.tally[k] / max) * 100}%"></i></div><span class="muted">${a.views.filter((v) => v.favors.includes(k)).length}</span>`).join('')}</div>
      <ul class="notes" style="margin-top:12px">${a.views.map((v) => `<li><a href="learn.html#${v.id}">${esc(names[v.id])}</a>: ${esc(v.note)}</li>`).join('')}</ul>
    </div>
  </div>`;
}

function familyCard(f, d) {
  const byId = Object.fromEntries(d.frameworks.map((x) => [x.id, x]));
  let bar = '';
  if (f.score != null) {
    const color = f.score > 0.05 ? 'var(--green)' : f.score < -0.05 ? 'var(--red)' : 'var(--yellow)';
    const w = Math.abs(f.score) * 50;
    bar = `<i style="background:${color};${f.score >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`}"></i>`;
  }
  return `<div class="card family">
    <h3><span>${esc(f.name)}</span><span class="score muted">${f.role === 'info' ? 'not scored' : f.score == null ? 'no data' : signed(f.score)}</span></h3>
    ${f.role === 'info' ? '' : `<div class="bar"><span class="mid"></span>${bar}</div>`}
    <ul class="votes">${f.members.map((id) => { const x = byId[id]; return `<li>
      <span class="dot ${voteClass(x.vote)}"></span>
      <span><a href="learn.html#${x.id}">${esc(x.name)}</a><span class="reading">${esc(x.reading)}</span></span>
      <span class="tag ${voteClass(x.vote)}">${esc(x.vote_label)}</span>${x.table ? `<div style="grid-column:1/-1">${miniTable(x.table)}</div>` : ''}</li>`; }).join('')}</ul>
  </div>`;
}

function families(d) {
  return Object.entries(ROLE).map(([role, [title, hint]]) => {
    const fams = d.families.filter((f) => f.role === role);
    if (!fams.length) return '';
    return `<h2>${title}</h2><p class="hint">${hint}</p><div class="grid ${role === 'info' ? '' : 'two'}">${fams.map((f) => familyCard(f, d)).join('')}</div>`;
  }).join('');
}

function changes(d) {
  return `<h2>What changed this month</h2><div class="card"><ul class="notes">${
    d.changes.length ? d.changes.map((c) => `<li>${esc(c)}</li>`).join('') : '<li>No votes changed from last month.</li>'}</ul></div>`;
}

function metrics(d, lessons) {
  const groups = [...new Set(d.metrics.map((m) => m.group))];
  return `<h2>Key metrics</h2><p class="hint">Tap any metric for what it is, why it matters and how to read it. Each is compared with its own average over the prior 12 months.</p>` +
    groups.map((g) => `<div class="label" style="margin:14px 0 6px">${esc(g)}</div><div class="grid three">${
      d.metrics.filter((m) => m.group === g).map((m) => {
        const ex = lessons.metrics[m.key];
        const cmp = m.vs_avg ? `<span class="${m.vs_avg === 'above' ? 'up' : m.vs_avg === 'below' ? 'down' : ''}">${m.vs_avg === 'above' ? '&#9650;' : m.vs_avg === 'below' ? '&#9660;' : '='} ${m.vs_avg}</span> its 12-month average (${esc(m.avg12)})` : '';
        return `<details class="metric"><summary><span class="label">${esc(m.label)}</span><span class="v">${esc(m.value)}</span><span class="cmp">${cmp}</span></summary>
          ${ex ? `<div class="explain"><p><b>What it is.</b> ${esc(ex.what)}</p><p><b>Why it matters.</b> ${esc(ex.why)}</p><p><b>How to read it.</b> ${esc(ex.read)}</p></div>` : ''}</details>`;
      }).join('')}</div>`).join('');
}

function drawHistory(d) {
  const h = d.history;
  new Chart($('#history'), {
    type: 'line',
    data: { labels: h.map((x) => x.date.slice(0, 7)), datasets: [
      { label: 'Consensus score', data: h.map((x) => x.composite), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.12)', fill: true, pointRadius: 0, borderWidth: 2, tension: 0.2, yAxisID: 'y' },
      { label: 'S&P 500', data: h.map((x) => x.sp500), borderColor: '#8b8fa3', pointRadius: 0, borderWidth: 1.5, yAxisID: 'y2' },
    ] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: '#8b8fa3', boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: '#8b8fa3', maxTicksLimit: 8 }, grid: { color: '#2a2d3a' } },
        y: { min: -1, max: 1, ticks: { color: '#8b8fa3' }, grid: { color: '#2a2d3a' }, title: { display: true, text: 'Score', color: '#8b8fa3' } },
        y2: { position: 'right', ticks: { color: '#8b8fa3' }, grid: { drawOnChartArea: false } },
      } },
  });
}

Promise.all([loadJSON('data/signals.json'), loadJSON('data/lessons.json')]).then(([d, lessons]) => {
  $('#app').innerHTML = sampleBanner(d) + verdict(d) + allocation(d) + families(d) + changes(d) +
    `<h2>Score history</h2><p class="hint">The consensus score against the S&P 500, monthly.</p><div class="card chart-card"><div style="position:relative;height:300px"><canvas id="history"></canvas></div></div>` +
    metrics(d, lessons);
  renderFooter(d);
  if (window.Chart) drawHistory(d);
  else $('#history').parentElement.outerHTML = '<span class="hint">The chart library did not load. The rest of the page is unaffected.</span>';
}).catch(showError);
</script>
</body>
</html>
